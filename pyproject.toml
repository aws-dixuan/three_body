[project]
name = "three-body"
version = "0.1.0"
description = "Three-body gravitational simulation and macOS screensaver"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
three-body = "python_version.main:main"

[dependency-groups]
screensaver = [
    "pygame>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_version", "screensaver"]
